<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./img/icon.png">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>

<body>
    <div class="menu-wrapper">
        <div class="menu">
            <header class="menu-header">
                <i class="bx bx-x" id="icon"></i>
            </header>
            <div class="menu-content">
                <a href="#" class="menu-link" data-city="Gyumri" data-title="Гюмри">Гюмри</a>
                <a href="#" class="menu-link" data-city="Erevan" data-title="Ереване">Ереван</a>
                <a href="#" class="menu-link" data-city="Moscow" data-title="Москве">Москва</a>
                <a href="#" class="menu-link" data-city="Paris" data-title="Париже">Париж</a>
                <a href="#" class="menu-link" data-city="Kyev" data-title="Киеве">Киев</a>
                <a href="#" class="menu-link" data-city="Washington" data-title="Вашингтоне">Вашингтон</a>
                <a href="#" class="menu-link" data-city="Sevan" data-title="Севане">Севан</a>
                <a href="#" class="menu-link" data-city="Tokyo" data-title="Токио">Токио</a>
                <a href="#" class="menu-link" data-city="Dubai" data-title="Дубае">Дубай</a>
                <a href="#" class="menu-link" data-city="Barcelona" data-title="Барселоне">Барселона</a>
                <a href="#" class="menu-link" data-city="Madrid" data-title="Мадриде">Мадрид</a>
                <a href="#" class="menu-link" data-city="Sochi" data-title="Сочи">Сочи</a>
                <a href="#" class="menu-link" data-city="Jermuk" data-title="Джермуке">Джермук</a>
                <a href="#" class="menu-link" data-city="Dilijan" data-title="Дилижане">Дилижан</a>
                <a href="#" class="menu-link" data-city="Rome" data-title="Риме">Рим</a>
                <a href="#" class="menu-link" data-city="Berlin" data-title="Берлине">Берлин</a>
                <a href="#" class="menu-link" data-city="London" data-title="Лондоне">Лондон</a>
                <a href="#" class="menu-link" data-city="Seoul" data-title="Сеуле">Сеул</a>
            </div>
        </div>
    </div>
    <main class="main">
        <header class="header">
            <h1 class="title">Погода в Гюмри</h1>
            <button class="btn">Города</button>
        </header>
        <div class="content-wrapper">
            <div class="content">
                <div class="grid">
                    <div class="grid-child">
                        <h2 class="grid-child-title">Температура</h2>
                        <p class="grid-child-text" id="temp-C"></p>
                    </div>
                    <div class="grid-child">
                        <h2 class="grid-child-title">Ощущается как</h2>
                        <p class="grid-child-text" id="Feels-Like-C"></p>
                    </div>
                    <div class="grid-child">
                        <h2 class="grid-child-title">Влажность</h2>
                        <p class="grid-child-text" id="humidity"></p>
                    </div>
                    <div class="grid-child">
                        <h2 class="grid-child-title">Скорость ветра</h2>
                        <p class="grid-child-text" id="wind-speed"></p>
                    </div>
                    <div class="grid-child">
                        <h2 class="grid-child-title">Давление</h2>
                        <p class="grid-child-text" id="pressure"></p>
                    </div>
                    <div class="grid-child">
                        <h2 class="grid-child-title">Видимость</h2>
                        <p class="grid-child-text" id="visibility"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>

</html>
